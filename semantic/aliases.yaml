# =============================================================================
# aliases.yaml - extra names for plants, and names that need a clarifying question.
#
# The entity resolver ALSO matches automatically (rapidfuzz) against the official
# names in the master tables: Master_Plants.StationName / StationShortName /
# StationOPPMS and Master_Stages.StageName / StageNameRealView / StageNameDescription.
# So only add names here that users say but the masters don't contain.
#
# To add an alias: put it under the plant code, save, restart the chatbot.
# "verify" = alias from general knowledge, please confirm.
# =============================================================================

